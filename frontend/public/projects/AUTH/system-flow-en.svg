<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title description">
  <title id="title">AUTH system flow</title>
  <desc id="description">A 16-stage ETL pipeline loads CTF C-drive evidence into three stores; LangGraph agents analyze it before evidence review and an employee response.</desc>
  <rect width="720" height="500" fill="#e3f1ed"/>
  <text x="60" y="42" fill="#173034" font-family="Pretendard, Arial, sans-serif" font-size="26" font-weight="700">AUTH system flow</text>
  <g font-family="Pretendard, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="62" width="600" height="62" rx="10" fill="#ffffff" stroke="#afcec7" stroke-width="2"/>
    <text x="360" y="101" fill="#173034" font-size="21" font-weight="600">CTF C-drive evidence</text>
    <rect x="60" y="143" width="600" height="62" rx="10" fill="#ffffff" stroke="#afcec7" stroke-width="2"/>
    <text x="360" y="182" fill="#173034" font-size="21" font-weight="600">16-stage ETL · extraction and conversion</text>
    <rect x="60" y="224" width="600" height="62" rx="10" fill="#ffffff" stroke="#afcec7" stroke-width="2"/>
    <text x="360" y="263" fill="#173034" font-size="21" font-weight="600">PostgreSQL · Qdrant · Neo4j</text>
    <rect x="60" y="305" width="600" height="62" rx="10" fill="#173034"/>
    <text x="360" y="331" fill="#ffffff" font-size="21" font-weight="600">LangGraph Supervisor</text>
    <text x="360" y="353" fill="#d9e8e5" font-size="16">Baseline · behavior · counter-evidence (5 agents)</text>
    <rect x="60" y="386" width="600" height="62" rx="10" fill="#ffffff" stroke="#afcec7" stroke-width="2"/>
    <text x="360" y="425" fill="#173034" font-size="21" font-weight="600">Evidence report · response · admin review</text>
  </g>
  <g stroke="#087b76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 124v16m-5-5 5 5 5-5"/>
    <path d="M360 205v16m-5-5 5 5 5-5"/>
    <path d="M360 286v16m-5-5 5 5 5-5"/>
    <path d="M360 367v16m-5-5 5 5 5-5"/>
  </g>
</svg>
